<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<style>.axis{stroke:#222;stroke-width:2}.grid{stroke:#ddd;stroke-width:1}.txt{font-family:Arial;font-size:18px;fill:#111}.title{font-family:Arial;font-size:28px;font-weight:bold;text-anchor:middle}.loo{fill:#fdae6b;stroke:#8c510a;stroke-width:2}.shap{fill:#74c476;stroke:#238b45;stroke-width:2}</style>
<text class="title" x="600" y="42">Cost-effectiveness of attribution methods</text>
<line class="axis" x1="120" y1="500" x2="1080" y2="500"/><line class="axis" x1="120" y1="90" x2="120" y2="500"/>
<text class="txt" x="600" y="565" text-anchor="middle">Attribution time, schematic log scale</text>
<text class="txt" x="20" y="300" transform="rotate(-90 20,300)" text-anchor="middle">NDCG@20 gain over uniform</text>
<line class="grid" x1="120" y1="420" x2="1080" y2="420"/><line class="grid" x1="120" y1="330" x2="1080" y2="330"/><line class="grid" x1="120" y1="240" x2="1080" y2="240"/><line class="grid" x1="120" y1="150" x2="1080" y2="150"/>
<circle class="loo" cx="350" cy="160" r="12"/><text class="txt" x="365" y="155">MovieLens LOO</text>
<circle class="shap" cx="890" cy="220" r="12"/><text class="txt" x="905" y="215">MovieLens Shapley</text>
<rect class="loo" x="250" y="275" width="22" height="22"/><text class="txt" x="280" y="292">Amazon LOO</text>
<rect class="shap" x="740" y="330" width="22" height="22"/><text class="txt" x="770" y="347">Amazon Shapley</text>
<text class="txt" x="600" y="90" text-anchor="middle">LOO gives higher NDCG gain per attribution hour on both datasets</text>
</svg>
