# Prospective graph-backbone run: LightGCN on custom temporal Amazon Books.
# Set dataset.books_5_json_gz to your local UCSD Amazon Reviews 2018 Books_5.json.gz path.

run:
  id: amazon_books_lightgcn_v3_prospective
  output_dir: results/journal_runs/amazon_books_lightgcn_v3_prospective
  device: auto
  seeds: [42, 43, 44, 45, 46]
  ks: [5, 10, 20]

dataset:
  name: amazon_books_2018_custom
  raw_dir: data/raw
  books_5_json_gz: data/raw/Books_5.json.gz  # or set AMAZON_BOOKS_5=/absolute/path/to/Books_5.json.gz
  max_rows: null
  sample_users: 50000
  sample_seed: 20260803
  rating_threshold: 4.0
  min_user_core: 5
  min_item_core: 5

backbone:
  name: lightgcn
  n_layers: 2
  dim: 64
  lr: 0.002
  weight_decay: 0.00001
  epochs: 15
  batch_size: 4096
  n_neg: 2
  score_batch_size: 128
  chunk_items: 4096

attribution:
  exact_threshold: 8
  m_permutations: 64
  shapley_users: null
  max_players_per_user: 24
  player_selection: stratified
  save_every: 10
  antithetic: true
  value_mode: pairwise_logsigmoid
  n_val_negatives: 100
  alpha: 1.0
  beta: 0.0
  lambda_pref: 0.0
  lambda_attr_value: 0.10

reranking:
  intervention: native
  lambda_attr: 0.10
  lambda_attr_sensitivity: [0.00, 0.05, 0.10, 0.20, 0.40]
  tau_att: 0.10
  primary_families: [uniform, additive-pref, shapley-mc]
  secondary_families: [attention, heuristic-pop, loo-marginal]

analysis:
  bootstrap_samples: 2000
  bootstrap_seed: 20260804
  controls: [uniform, additive-pref, attention, loo-marginal]
