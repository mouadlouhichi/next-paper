# Template for the actual Q1 confirmatory case-study configuration.
# Do not run as confirmatory until the missing real artifacts exist:
# ethics determination, HCCF fork/commit, PORT.md, lockfile/container,
# official-code validation rerun, deterministic inference tests, external preregistration.

run:
  id: hccf_confirmatory_TEMPLATE
  output_dir: results/journal_runs/hccf_confirmatory_TEMPLATE
  device: cuda
  seeds: [42, 43, 44, 45, 46]
  ks: [5, 10, 20]

dataset:
  name: ml1m       # duplicate this file for amazon_books_2018_custom
  raw_dir: data/raw
  sample_users: null
  sample_seed: 20260803
  rating_threshold: 4.0
  min_user_core: 5
  min_item_core: 5

backbone:
  name: hccf_validated_port
  fork_url: TODO
  fork_commit: TODO
  license: TODO
  port_md: PORT.md
  validation_artifact: results/validation/hccf_validation_report.json
  validation_tolerance:
    metrics: [HitRate@20, NDCG@20]
    seeds: [42, 43, 44, 45, 46]
    max_relative_difference: 0.05
    max_absolute_difference: 0.005
  dim: TODO
  lr: TODO
  weight_decay: TODO
  epochs: TODO
  batch_size: TODO
  n_neg: 4
  ssl_reg: TODO
  temp: TODO
  keepRate: TODO

attribution:
  # Prospective confirmatory redesign.
  exact_threshold: 8
  m_permutations: 128
  diagnostic_permutations: [16, 32, 64, 128]
  reference_permutations: 512
  shapley_users: null
  max_players_per_user: 24
  player_selection: stratified
  player_count_sensitivity: [12, 24, 48]
  selection_sensitivity: [similarity, recency, stratified, random]
  save_every: 10
  antithetic: true
  common_random_numbers: true
  value_mode: pairwise_logsigmoid
  n_val_negatives: 100
  alpha: 1.0
  beta: 0.0
  lambda_pref: 0.0
  lambda_attr_value: 0.10

reranking:
  intervention: native
  diagnostic_intervention: kernel
  lambda_attr: 0.10
  lambda_attr_sensitivity: [0.00, 0.05, 0.10, 0.20, 0.40]
  tau_att: 0.10
  primary_families: [uniform, additive-pref, shapley-mc]
  confirmatory_controls: [uniform, additive-pref, attention, loo-marginal]
  secondary_families: [attention, heuristic-pop, loo-marginal]

explanation_metrics:
  deletion_comprehensiveness: true
  insertion_sufficiency: true
  perturbation_stability: true
  model_randomization: true

analysis:
  bootstrap_samples: 2000
  bootstrap_seed: 20260804
  hierarchical_testing:
    gate_1: shapley-mc_vs_uniform
    gate_2: shapley-mc_vs_additive-pref
    gate_3: shapley-mc_noninferiority_or_superiority_vs_attention
  primary_contrasts:
    - dataset: ml1m
      backbone: hccf_validated_port
      metric: NDCG@20
      treatment: shapley-mc
      control: uniform
    - dataset: ml1m
      backbone: hccf_validated_port
      metric: HitRate@20
      treatment: shapley-mc
      control: uniform
    - dataset: amazon_books_2018_custom
      backbone: hccf_validated_port
      metric: NDCG@20
      treatment: shapley-mc
      control: uniform
    - dataset: amazon_books_2018_custom
      backbone: hccf_validated_port
      metric: HitRate@20
      treatment: shapley-mc
      control: uniform
