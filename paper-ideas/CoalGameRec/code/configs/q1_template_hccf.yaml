# Template for the actual Q1 confirmatory case-study configuration.
# Do not run as confirmatory until the missing real artifacts exist:
# ethics determination, HCCF fork/commit, PORT.md, lockfile/container,
# official-code validation rerun, deterministic inference tests, external preregistration.

run:
  id: hccf_confirmatory_TEMPLATE
  output_dir: results/journal_runs/hccf_confirmatory_TEMPLATE
  device: cuda   # or mps/cpu only if validated for the port
  seeds: [42, 43, 44, 45, 46]
  ks: [5, 10, 20]

dataset:
  name: ml1m       # duplicate this file for amazon_books_2018_custom
  raw_dir: data/raw
  sample_users: null
  sample_seed: 20260803
  rating_threshold: 4.0
  min_user_core: 5
  min_item_core: 5

backbone:
  name: hccf_validated_port
  fork_url: TODO
  fork_commit: TODO
  license: TODO
  port_md: PORT.md
  validation_artifact: results/validation/hccf_validation_report.json
  validation_tolerance:
    metrics: [HitRate@20, NDCG@20]
    seeds: [42, 43, 44, 45, 46]
    max_relative_difference: 0.05
    max_absolute_difference: 0.005
  dim: TODO
  lr: TODO
  weight_decay: TODO
  epochs: TODO
  batch_size: TODO
  n_neg: 4
  ssl_reg: TODO
  temp: TODO
  keepRate: TODO

attribution:
  exact_threshold: 8
  m_permutations: 128
  shapley_users: null
  alpha: 0.70
  beta: 0.30
  lambda_pref: 0.20
  lambda_attr_value: 0.10

reranking:
  lambda_attr: 0.10
  lambda_attr_sensitivity: [0.05, 0.10, 0.20]
  tau_att: 0.10
  primary_families: [uniform, additive-pref, shapley-mc]
  secondary_families: [attention, heuristic-pop]

analysis:
  bootstrap_samples: 2000
  bootstrap_seed: 20260804
  primary_contrasts:
    - dataset: ml1m
      backbone: hccf_validated_port
      metric: NDCG@20
      treatment: shapley-mc
      control: uniform
    - dataset: ml1m
      backbone: hccf_validated_port
      metric: HitRate@20
      treatment: shapley-mc
      control: uniform
    - dataset: amazon_books_2018_custom
      backbone: hccf_validated_port
      metric: NDCG@20
      treatment: shapley-mc
      control: uniform
    - dataset: amazon_books_2018_custom
      backbone: hccf_validated_port
      metric: HitRate@20
      treatment: shapley-mc
      control: uniform
