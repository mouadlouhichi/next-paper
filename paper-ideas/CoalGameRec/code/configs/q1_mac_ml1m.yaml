# CoalGameRec reproducible journal-style local configuration
# This configuration is suitable for producing a complete MovieLens-1M local run
# on a Mac M4 Pro / 48GB RAM. It is still a prototype backbone run unless
# backbone.name is replaced by a validated HCCF adapter.

run:
  id: ml1m_mac_journal_v1
  output_dir: results/journal_runs/ml1m_mac_journal_v1
  device: auto
  seeds: [42, 43, 44, 45, 46]
  ks: [5, 10, 20]

# Dataset protocol
dataset:
  name: ml1m
  raw_dir: data/raw
  sample_users: null       # null = full MovieLens-1M after protocol filtering
  sample_seed: 20260803
  rating_threshold: 4.0
  min_user_core: 5
  min_item_core: 5

# Local executable backbone. For confirmatory Q1 case-study claims, replace
# this with the validated HCCF port and record PORT.md/validation artifacts.
backbone:
  name: bprmf
  dim: 64
  lr: 0.002
  weight_decay: 0.00001
  epochs: 25
  batch_size: 4096
  n_neg: 4
  score_batch_size: 256
  chunk_items: null

attribution:
  exact_threshold: 8
  m_permutations: 32
  shapley_users: null      # null = all users; use an integer only for smoke tests
  max_players_per_user: 24 # laptop-feasible bounded-player estimator; set null for unbounded/HPC
  player_selection: similarity
  save_every: 10
  alpha: 0.70
  beta: 0.30
  lambda_pref: 0.20
  lambda_attr_value: 0.10

reranking:
  lambda_attr: 0.10
  lambda_attr_sensitivity: [0.05, 0.10, 0.20]
  tau_att: 0.10
  primary_families: [uniform, additive-pref, shapley-mc]
  secondary_families: [attention, heuristic-pop]

analysis:
  bootstrap_samples: 2000
  bootstrap_seed: 20260804
  primary_contrasts:
    - metric: NDCG@20
      treatment: shapley-mc
      control: uniform
    - metric: HitRate@20
      treatment: shapley-mc
      control: uniform
