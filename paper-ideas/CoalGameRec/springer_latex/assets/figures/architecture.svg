<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <style>
      .box{fill:#eef5ff;stroke:#2b5d9a;stroke-width:2;rx:12;}
      .game{fill:#fff1dc;stroke:#b66b00;stroke-width:2;rx:12;}
      .out{fill:#eaf8ec;stroke:#2e7d32;stroke-width:2;rx:12;}
      .txt{font-family:Arial, sans-serif;font-size:22px;text-anchor:middle;dominant-baseline:middle;fill:#111;}
      .small{font-family:Arial, sans-serif;font-size:18px;text-anchor:middle;fill:#333;}
      .arrow{stroke:#333;stroke-width:3;marker-end:url(#arrow);fill:none;}
      .dash{fill:none;stroke:#777;stroke-width:2;stroke-dasharray:8 6;rx:16;}
    </style>
  </defs>
  <text x="700" y="40" font-family="Arial" font-size="30" text-anchor="middle" font-weight="bold">Cooperative-game explanation pipeline for graph recommendation</text>
  <rect class="box" x="55" y="95" width="210" height="82" rx="12"/>
  <text class="txt" x="160" y="125">User history</text><text class="small" x="160" y="154">training interactions</text>
  <rect class="box" x="330" y="95" width="210" height="82" rx="12"/>
  <text class="txt" x="435" y="125">LightGCN</text><text class="small" x="435" y="154">graph backbone</text>
  <rect class="box" x="605" y="95" width="230" height="82" rx="12"/>
  <text class="txt" x="720" y="125">Cached base</text><text class="small" x="720" y="154">full-graph scores</text>
  <rect class="game" x="55" y="315" width="230" height="86" rx="12"/>
  <text class="txt" x="170" y="345">Bounded players</text><text class="small" x="170" y="375">24 stratified interactions</text>
  <rect class="game" x="350" y="315" width="230" height="86" rx="12"/>
  <text class="txt" x="465" y="345">Validation game</text><text class="small" x="465" y="375">pairwise log-sigmoid</text>
  <rect class="game" x="645" y="315" width="230" height="86" rx="12"/>
  <text class="txt" x="760" y="345">Credit allocation</text><text class="small" x="760" y="375">Shapley or LOO</text>
  <rect class="out" x="950" y="315" width="225" height="86" rx="12"/>
  <text class="txt" x="1062" y="345">Native embedding</text><text class="small" x="1062" y="375">post-hoc reranking</text>
  <rect class="out" x="1050" y="95" width="225" height="82" rx="12"/>
  <text class="txt" x="1162" y="125">Test ranking</text><text class="small" x="1162" y="154">full catalogue</text>
  <rect class="out" x="1050" y="480" width="225" height="82" rx="12"/>
  <text class="txt" x="1162" y="510">Diagnostics</text><text class="small" x="1162" y="539">cost and explanation</text>
  <path class="arrow" d="M265 136 H330"/><path class="arrow" d="M540 136 H605"/>
  <path class="arrow" d="M160 177 V315"/><path class="arrow" d="M285 358 H350"/><path class="arrow" d="M580 358 H645"/><path class="arrow" d="M875 358 H950"/>
  <path class="arrow" d="M835 136 C910 136,930 300,950 335"/>
  <path class="arrow" d="M1062 315 C1090 240,1120 190,1162 177"/>
  <path class="arrow" d="M1062 401 C1090 445,1120 465,1162 480"/>
  <rect class="dash" x="35" y="285" width="865" height="145" rx="16"/>
  <text class="small" x="467" y="455">cooperative-game attribution layer</text>
</svg>
