# Final ActionShap experiment contract. Paths are repository-relative to code/.
# The suite refuses to generate a PASS report until both datasets and both
# history-conditioned models have complete five-seed and convergence outputs.

datasets:
  - name: MovieLens-1M
    format: ml1m
    path: data/ml-1m/ratings.dat
    rating_threshold: 4.0
  # Built from Amazon Review Data (2018) Digital_Music_5.json.gz with
  # scripts/prepare_amazon_digital_music.py.
  - name: Amazon-Digital-Music
    format: csv
    path: data/amazon-digital-music/interactions.csv
    user_column: user
    item_column: item
    timestamp_column: timestamp
    rating_column: rating
    rating_threshold: 4.0

primary_model: itemknn
models:
  - itemknn
  - profile

seeds: [42, 43, 44, 45, 46]
candidate_seed: 1729
user_seed: 2718
tie_seed: 31415
max_users: 1000              # seeded random users; never the first IDs
full_catalog_users: 250      # robustness subset, selected with user_seed
robustness_null_draws: 100    # headline null calibration remains on primary runs
minimum_interactions: 4
n_max: 20
evaluation_size: 200
k: 10
utility: target_margin          # attribution game; NDCG remains action outcome
action_rho: 0.5
budget: 2
permutations: 500            # conservative floor; raise if convergence selects more
lime_samples: 512
null_draws: 1000
gate_users: 200
oracle_users: 0              # exact B<=2 oracle for every sampled-ranking user
epochs: 10
embedding_dim: 64
profile_samples_per_user: 1
profile_learning_rate: 0.03
profile_regularization: 0.0001
itemknn_neighbours: 200
convergence_users: 100
convergence_budgets: [25, 50, 100, 250, 500, 1000]
convergence_reference: 1000

# One-factor-at-a-time robustness on MovieLens/profile, five common seeds.
# Every condition keeps the same candidate/user/tie seeds.
sensitivity_users: 250
sensitivity_null_draws: 100    # headline null calibration remains 1000
sensitivities:
  - {name: nmax50, n_max: 50}
  - {name: nmax100, n_max: 100}
  - {name: rho025, action_rho: 0.25}
  - {name: candidates100, evaluation_size: 100}
  - {name: candidates500, evaluation_size: 500}
  - {name: budget1, budget: 1}
  - {name: budget3, budget: 3, oracle_users: 100}
  - {name: utility-ndcg, utility: ndcg}
